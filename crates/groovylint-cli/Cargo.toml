[package]
name = "groovylint"
description = "Static analysis for Groovy, inspired by CodeNarc and Checker Framework"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "groovylint_cli"
path = "src/lib.rs"

[[bin]]
name = "groovylint"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
groovylint-analysis = { path = "../groovylint-analysis" }
groovylint-arch = { path = "../groovylint-arch" }
groovylint-config = { path = "../groovylint-config" }
groovylint-core = { path = "../groovylint-core" }
groovylint-rules = { path = "../groovylint-rules" }
groovylint-syntax = { path = "../groovylint-syntax" }
ignore.workspace = true
rayon.workspace = true
serde_json.workspace = true

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
tempfile.workspace = true

[[bench]]
name = "linter"
harness = false

[lints]
workspace = true
