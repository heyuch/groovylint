name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  native:
    name: Native ${{ matrix.platform }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: osx-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p groovylint

      - name: Stage native binary
        shell: bash
        run: |
          mkdir -p "stage/${{ matrix.platform }}"
          cp "target/${{ matrix.target }}/release/groovylint" "stage/${{ matrix.platform }}/groovylint"
          chmod +x "stage/${{ matrix.platform }}/groovylint"

      - name: Upload native artifact
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.platform }}
          path: stage/
          if-no-files-found: error

  publish:
    name: Publish and release
    needs: native
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download native artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: gradle-plugin/build/native
          merge-multiple: true

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify release versions
        shell: bash
        run: |
          set -euo pipefail
          gradle_version=$(awk -F= '/^version=/{print $2}' gradle-plugin/gradle.properties)
          cargo_version=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          test "v${gradle_version}" = "${GITHUB_REF_NAME}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match plugin version v${gradle_version}" >&2
            exit 1
          }
          test "${cargo_version}" = "${gradle_version}" || {
            echo "Cargo version ${cargo_version} does not match plugin version ${gradle_version}" >&2
            exit 1
          }

      - name: Verify embedded native binaries
        run: ./gradlew -p gradle-plugin verifyNativeBinaries --no-configuration-cache

      - name: Publish to Maven Central and Gradle Plugin Portal
        run: |
          ./gradlew -p gradle-plugin \
            publishToMavenCentral publishPlugins \
            --no-configuration-cache --stacktrace
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk -F= '/^version=/{print $2}' gradle-plugin/gradle.properties)
          mkdir -p dist
          for platform in osx-aarch64 linux-x86_64; do
            tar -czf "dist/groovylint-${version}-${platform}.tar.gz" \
              -C "gradle-plugin/build/native/${platform}" groovylint
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
