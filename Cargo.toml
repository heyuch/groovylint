[workspace]
resolver = "3"
members = [
    "crates/groovylint-analysis",
    "crates/groovylint-cli",
    "crates/groovylint-config",
    "crates/groovylint-core",
    "crates/groovylint-rules",
    "crates/groovylint-syntax",
]
default-members = ["crates/groovylint-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
authors = ["groovylint contributors"]
license = "MIT"
keywords = ["groovy", "static-analysis", "lint", "codenarc"]
categories = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
rayon = "1.10"
fancy-regex = "0.20"
regex = "1.11"
roxmltree = "0.21"
serde_json = "1.0"
tempfile = "3.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
non_ascii_idents = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Intentionally relaxed: these produce noise in a codebase that is still
# establishing its public API and documentation.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
too_many_lines = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
